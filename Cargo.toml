[package]
name = "agentpacknest"
version = "0.2.0"
edition = "2021"
description = "Package coding agents into portable, reproducible bundles"
license = "MIT"

[[bin]]
name = "pn"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Error handling
anyhow = "1"
thiserror = "2"

# Filesystem
dirs = "6"
walkdir = "2"

# Crypto / security
sha2 = "0.10"
hex = "0.4"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
rpassword = "7"
zeroize = { version = "1", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }

# Archive
flate2 = "1"
tar = "0.4"

[dev-dependencies]
tempfile = "3"
